<!DOCTYPE html>
<html>
  <head>
    <title>FI Table Generator</title>
    <link rel="stylesheet" media="all" href="uswds.css"></link>
    <link rel="stylesheet" media="all" href="custom-styles.css"></link>
  </head>
  <body>
    <div id="fileupload" class="grid-container">
      <input id="file" name="file" type="file" accept=".csv" hidden>
      <label id="file-upload" for="file"></label>
    </div>
    <div id="tablewidget" class="grid-container display-none">
      <div id="ui" style="padding-bottom: 1rem; border-bottom: 1px solid #ccc;">
        <div id="ui--dropdowns">
          <div style="display: inline-block; width: 50%; padding-right: 1rem;">
            <label for="ui--dropdowns--region">Select Region</label>
            <select class="usa-select" id="ui--dropdowns--region" name="ui--dropdowns--region">
              <option value="highplains" selected>High Plains</option>
              <option value="northeast">Northeast</option>
              <option value="south">South</option>
              <option value="southeast">Southeast</option>
              <option value="west">West</option>
            </select>
          </div><div style="display: inline-block; width: 50%; padding-left: 1rem;">
            <label for="ui--dropdowns--season">Select Season</label>
            <select class="usa-select" id="ui--dropdowns--season" name="ui--dropdowns--season">
              <option value="all" selected>All Seasons</option>
              <option value="winter">Winter</option>
              <option value="spring">Spring</option>
              <option value="summer">Summer</option>
              <option value="fall">Fall</option>
            </select>
          </div>
        </div>
      </div>
      <div id="tabs">
        <span for="table-default" class="tab active">Separated Datasets</span>
        <span for="table-merged" class="tab">Merged Datasets</span>
      </div>
      <div id="legend">
        <div class="legend-item"><label for="precip"><span class="legend-icon" style="background: #A6CFE3;"></span><span>Precipitation</span></span></label><input id="precip" data-for="Precipitation-Based Indicators" type="text" value="#A6CFE3" title="Update the colors for Precipitation-Based Indicators"></div>
        <div class="legend-item"><label for="evap"><span class="legend-icon" style="background: #FEC06D;"></span><span title="Evaporation-Based Indicators">Evaporation</span></label><input id="evap" data-for="Evaporation-Based Indicators" type="text" value="#FEC06D" title="Update the colors for Evaporation-Based Indicators"></div>
        <div class="legend-item"><label for="soil"><span class="legend-icon" style="background: #b3d78a;"></span><span>Soil Moisture</span></label><input id="soil" data-for="Soil Moisture" type="text" value="#b3d78a" title="Update the colors for Soil Moisture Indicators"></div>
        <div class="legend-item"><label for="stream"><span class="legend-icon" style="background: #1479B5;"></span><span>Streamflow</span></label><input id="stream" data-for="Streamflow" type="text" value="#1479B5" title="Update the colors for Streamflow Indicators"></div>
        <div class="legend-item"><label for="runoff"><span class="legend-icon" style="background: #CAB3D7;"></span><span>Runoff</span></label><input id="runoff" data-for="Runoff" type="text" value="#CAB3D7" title="Update the colors for Runoff Indicators"></div>
        <div class="legend-item"><label for="palmer"><span class="legend-icon" style="background: #fff;"></span><span>Palmer Indices</span></label><input id="palmer" data-for="Palmer Indices" type="text" value="#ffffff" title="Update the colors for Palmer Indices Indicators"></div>
        <button id="legend-reset" class="usa-button--secondary">Reset colors to default</button>
      </div>
      <div id="table-default" class="table"></div>
      <div id="table-merged" class="table display-none"></div>
    </div>
    <script src="index.js"></script>
    <script src="interactions.js"></script>
  </body>
</html>
