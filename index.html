<!DOCTYPE html>
<html>
  <head>
    <title>FI Table Generator</title>
    <link rel="stylesheet" media="all" href="uswds.css?v=3"></link>
    <link rel="stylesheet" media="all" href="custom-styles.css?v=3"></link>
  </head>
  <body class="indicator-icon">
    <div id="fileupload" class="grid-container">
      <input id="file" name="file" type="file" accept=".csv" hidden>
      <label id="file-upload" for="file"></label>
    </div>
    <div id="tablewidget" class="grid-container display-none">
      <div id="ui" style="padding-bottom: 1rem; border-bottom: 1px solid #ccc;">
        <div id="ui--dropdowns">
          <div style="display: inline-block; width: 50%; padding-right: 1rem;">
            <label for="ui--dropdowns--region">Select Region</label>
            <select class="usa-select" id="ui--dropdowns--region" name="ui--dropdowns--region">
              <option value="highplains" selected>High Plains</option>
              <option value="midwest">Midwest</option>
              <option value="northeast">Northeast</option>
              <option value="south">South</option>
              <option value="southeast">Southeast</option>
              <option value="west">West</option>
            </select>
          </div><div style="display: inline-block; width: 50%; padding-left: 1rem;">
            <label for="ui--dropdowns--season">Select Season</label>
            <select class="usa-select" id="ui--dropdowns--season" name="ui--dropdowns--season">
              <option value="all" selected>All Seasons</option>
              <option value="winter">Winter</option>
              <option value="spring">Spring</option>
              <option value="summer">Summer</option>
              <option value="fall">Fall</option>
            </select>
          </div>
        </div>
      </div>
      <div id="tabs">
        <span for="table-merged" class="tab active">Merged Datasets</span>
        <span for="table-default" class="tab">Separated Datasets</span>
      </div>
      <div id="legend">
        <div class="legend-item"><label for="precip"><span class="legend-icon" style="background: #fff;"></span><span>Precipitation</span></span></label><label for="precip" class="legend-bg legend-ui-label">BG: </label><input id="precip" data-for="Precipitation-Based Indicators" type="text" value="#ffffff" title="Update the colors for Precipitation-Based Indicators"><label for="precip-text" class="legend-text legend-ui-label">White text: </label><input id="precipText" type="checkbox" data-for="Precipitation-Based Indicators"></div>
        <div class="legend-item"><label for="evap"><span class="legend-icon" style="background: #fff;"></span><span title="Evaporation-Based Indicators">Evaporation</span></label><label for="evap" class="legend-bg legend-ui-label">BG: </label><input id="evap" data-for="Evaporation-Based Indicators" type="text" value="#ffffff" title="Update the colors for Evaporation-Based Indicators"><label for="evap-text" class="legend-text legend-ui-label">White text: </label><input id="evapText" type="checkbox" data-for="Evaporation-Based Indicators"></div>
        <div class="legend-item"><label for="soil"><span class="legend-icon" style="background: #fff;"></span><span>Soil Moisture</span></label><label for="soil" class="legend-bg legend-ui-label">BG: </label><input id="soil" data-for="Soil Moisture" type="text" value="#ffffff" title="Update the colors for Soil Moisture Indicators"><label for="precip-text" class="legend-text legend-ui-label">White text: </label><input id="soilText" type="checkbox" data-for="Soil Moisture"></div>
        <div class="legend-item"><label for="stream"><span class="legend-icon" style="background: #fff;"></span><span>Streamflow</span></label><label for="stream" class="legend-bg legend-ui-label">BG: </label><input id="stream" data-for="Streamflow" type="text" value="#ffffff" title="Update the colors for Streamflow Indicators"><label for="precip-text" class="legend-text legend-ui-label">White text: </label><input id="streamText" type="checkbox" data-for="Streamflow"></div>
        <div class="legend-item"><label for="runoff"><span class="legend-icon" style="background: #fff;"></span><span>Runoff</span></label><label for="runnoff" class="legend-bg legend-ui-label">BG: </label><input id="runoff" data-for="Runoff" type="text" value="#ffffff" title="Update the colors for Runoff Indicators"><label for="precip-text" class="legend-text legend-ui-label">White text: </label><input id="runoffText" type="checkbox" data-for="Runoff"></div>
        <div class="legend-item"><label for="palmer"><span class="legend-icon" style="background: #fff;"></span><span>Palmer Indices</span></label><label for="palmer" class="legend-bg legend-ui-label">BG: </label><input id="palmer" data-for="Palmer Indices" type="text" value="#ffffff" title="Update the colors for Palmer Indices Indicators"><label for="palmer-text" class="legend-text legend-ui-label">White text: </label><input id="palmerText" type="checkbox" data-for="Palmer Indices"></div>
        <div class="legend-item"><label for="groundwater"><span class="legend-icon" style="background: #fff;"></span><span>Groundwater</span></label><label for="groundwater" class="legend-bg legend-ui-label">BG: </label><input id="groundwater" data-for="Groundwater" type="text" value="#ffffff" title="Update the colors for Groundwater Indicators"><label for="groundwater-text" class="legend-text legend-ui-label">White text: </label><input id="groundwaterText" type="checkbox" data-for="Groundwater"></div>
        <div style="width: 100%;">
          <button id="icon-toggle" class="usa-button">Show Indicator Type Text</button>
          <span id="icon-toggle-text" style="margin-left: .5rem;">Current: Displays Indicator Type Icons</span>
          <button id="legend-reset" class="usa-button usa-button--secondary">Reset options to default</button>
        </div>
      </div>
      <div id="table-default" class="table display-none"></div>
      <div id="table-merged" class="table"></div>
    </div>
    <script src="index.js?v=5"></script>
    <script src="interactions.js?v=5"></script>
  </body>
</html>
