<!DOCTYPE html>
<html>
  <head>
    <title>FI Table Generator</title>
    <link rel="stylesheet" media="all" href="uswds.css"></link>
    <link rel="stylesheet" media="all" href="custom-styles.css"></link>
  </head>
  <body>
    <div id="fileupload" class="grid-container">
      <input id="file" name="file" type="file" accept=".csv" hidden>
      <label id="file-upload" for="file"></label>
    </div>
    <div id="tablewidget" class="grid-container display-none">
      <div id="ui" style="padding-bottom: 1rem; border-bottom: 1px solid #ccc;">
        <div id="ui--dropdowns">
          <div style="display: inline-block; width: 50%; padding-right: 1rem;">
            <label for="ui--dropdowns--region">Select Region</label>
            <select class="usa-select" id="ui--dropdowns--region" name="ui--dropdowns--region">
              <option value="highplains" selected>High Plains</option>
              <option value="northeast">Northeast</option>
              <option value="south">South</option>
              <option value="southeast">Southeast</option>
              <option value="west">West</option>
            </select>
          </div><div style="display: inline-block; width: 50%; padding-left: 1rem;">
            <label for="ui--dropdowns--season">Select Season</label>
            <select class="usa-select" id="ui--dropdowns--season" name="ui--dropdowns--season">
              <option value="all" selected>All Seasons</option>
              <option value="winter">Winter</option>
              <option value="spring">Spring</option>
              <option value="summer">Summer</option>
              <option value="fall">Fall</option>
            </select>
          </div>
        </div>
      </div>
      <div id="legend">
        <div class="legend-item"><span class="legend-icon" style="background: #A6CFE3;"></span><span>Precipitation-Based Indicators</span></span></div>
        <div class="legend-item"><span class="legend-icon" style="background: #FEC06D;"></span><span>Evapotranspiration-Based Indicators</span></div>
        <div class="legend-item"><span class="legend-icon" style="background: #b3d78a;"></span><span>Soil Moisture</span></div>
        <div class="legend-item"><span class="legend-icon" style="background: #1479B5;"></span><span>Streamflow</span></div>
        <div class="legend-item"><span class="legend-icon" style="background: #CAB3D7;"></span><span>Runoff</span></div>
        <div class="legend-item"><span class="legend-icon" style="background: #fff;"></span><span>Palmer Indices</span></div>
      </div>
      <div id="table-default"></div>
      <div id="table-merged" class="display-none"></div>
    </div>
    <script src="index.js"></script>
    <script src="interactions.js"></script>
  </body>
</html>
